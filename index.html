<script>
const video = document.getElementById('bg-video');
const btn = document.getElementById('soundBtn');
let isMuted = true;
video.muted = true;
video.play().catch(()=>{});
btn.onclick = () => {
  if(isMuted){
    video.muted = false;
    btn.innerText = "🔊 Sound On";

    btn.innerText = "🔇 Sound Off";
    isMuted = true;
  }
};
